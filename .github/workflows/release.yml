name: Package release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require a matching version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag must match package.json version.');
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Create tarball and SHA-256 manifest
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const files = readdirSync('release').filter(name => name.endsWith('.tgz')).sort();
          if (files.length !== 1) throw new Error('Expected one package tarball.');
          writeFileSync('release/SHA256SUMS', files.map(name => `${createHash('sha256').update(readFileSync(`release/${name}`)).digest('hex')}  ${name}\n`).join(''));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: build-escape-package
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Attach the verified package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.tgz release/SHA256SUMS --clobber
